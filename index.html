<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Time Observations</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:1.25rem}
  h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.05;margin:0}
  .gallery{columns:4;column-gap:0}
  figure{break-inside:avoid;position:relative;margin:0;overflow:hidden}
  figure img{display:block;width:100%;height:auto}
  figcaption{position:absolute;right:0;bottom:0;left:0;padding:.65rem .75rem;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:.95rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:900px){.gallery{columns:3}}
  @media(max-width:600px){.gallery{columns:2}}
</style>
</head>
<body>
<header>
  <h1>Play Time Observations</h1>
</header>
<main class="gallery" id="gallery" aria-label="Play time observation photos"></main>
<script>
// Small CSV parser that handles quoted fields, commas, and line breaks inside quotes.
function parseCSV(text){
  const rows=[];let row=[],field='',q=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){field+='"';i++} else q=false } else field+=c }
    else if(c=='"') q=true;
    else if(c==','){row.push(field);field=''}
    else if(c=='\n'){row.push(field);rows.push(row);row=[];field=''}
    else if(c!='\r') field+=c;
  }
  if(field||row.length){row.push(field);rows.push(row)}
  const head=rows.shift();
  return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])));
}
fetch('data/play-time-database.csv')
  .then(response=>{if(!response.ok)throw new Error(`CSV request failed: ${response.status}`);return response.text()})
  .then(text=>{
    const gallery=document.getElementById('gallery');
    for(const entry of parseCSV(text)){
      if(!entry.photo)continue;
      const figure=document.createElement('figure');
      const image=document.createElement('img');
      image.src=entry.photo;
      image.alt=entry.activity||`Play time observation, row ${entry.row}`;
      const caption=document.createElement('figcaption');
      caption.textContent=entry.activity||'(untitled)';
      figure.append(image,caption);
      gallery.append(figure);
    }
  })
  .catch(error=>{
    const message=document.createElement('p');
    message.textContent='Unable to load the observation photos.';
    document.getElementById('gallery').append(message);
    console.error(error);
  });
</script>
</body>
</html>
